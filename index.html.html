<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0">
<title>Tic Tac Toe Game</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}
.container{
width:400px;
background:#fff;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 10px 25px
rgba(0,0,0,.3);
}
h1{
margin-bottom:15px;
color:#333;
}
#status{
font-size:20px;
margin-bottom:20px;
color:#444;
font-weight:bold;
}
.board{
display:grid;
grid-template-columns:repeat(3,100px);
grid-template-rows:repeat(3,100px);
gap:10px;
justify-content:center;
}
.cell{
background:#f2f2f2;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}
.cell:hover{
background:#ddd;
transform:scale(1.05);
}
.win{
background:#4CAF50 !important;
color:#fff;
}
button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:8px;
background:#2196F3;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.3s;
}
button:hover{
background:#0b7dda;
}
@media(max-width:450px){
.container{
width:95%;
}
.board{
grid-template-columns:repeat(3,80px);
grid-template-rows:repeat(3,80px);
}
.cell{
font-size:45px;
}
}
</style>
</head>
<body>
<div class="container">
<h1>Tic Tac Toe</h1>
<div id="status">Player X Turn</div>
<div class="board">
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>
</div>
<button
onClick="restartGame()">RestartGame</button>
</div>
<script>
const cells=document.querySelectorAll(".cell");
const status=document.getElementById("status");
let board=["","","","","","","","",""];
let currentPlayer="X";
let gameActive=true;
const winPatterns=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];
cells.forEach((cell,index)=>{
cell.addEventListener("click",()=>play(index));
});
function play(index){
if(board[index]!=""|| !gameActive)
return;
board[index]=currentPlayer;
cells[index].textContent=currentPlayer;
checkWinner();
}
function checkWinner(){
for(let pattern of winPatterns){
let[a,b,c]=pattern;
if(
board[a] &&
board[a]==board[b]&&
board[b]==board[c]
){
cells[a].classList.add("win");
cells[b].classList.add("win");
cells[c].classList.add("win");
status.innerHTML="player"+currentPlayer+"Wins!";
gameActive=flase;
return;
}
}
if(!board.includes("")){
status.innerHTML="Match Draw!";
gameActive=flase;
return;
}
currentPlayer=currentPlayer=="X"?"O":"X";
status.innerHTML="Player"+currentPlayer+"Turn";
}
function restartGame(){
board=["","","","","","","","", ""];
currentPlayer="X";
gameActive=true;
status.innerHTML="Player X Turn";
cells.forEach(cell=>{
cell.textContent="";
cell.classList.remove("win");
});
}
</script>
</body>
</html>
